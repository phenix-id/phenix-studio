name: Build and Push to Azure ACR

on:
  push:
    tags:
      - 'prod-studio-*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: phenixprodacr
  ACR_SERVER: phenixprodacr.azurecr.io
  IMAGE_NAME: phenix-studio
  MANIFEST_ENV: prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      image_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set image tag
        id: tag
        run: |
          SHA="${GITHUB_SHA::8}"
          RELEASE_TAG="$(date -u +%Y%m%d%H%M%S)-$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}
            ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha }}
            ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_MODE=DEV
            NEXT_PUBLIC_BASE_URL=https://service.phenix-id.com
            NEXT_PUBLIC_ECOSYSTEM_FRONT_END_URL=https://studio.phenix-id.com
            NEXT_PUBLIC_PLATFORM_NAME=Phenix
            NEXT_PUBLIC_ACTIVE_THEME=phenix
            NEXT_PUBLIC_APP_TITLE=Phenix Studio
            NEXT_PUBLIC_FOOTER_TEXT=Phenix ID. All rights reserved.
            NEXT_PUBLIC_LOGO_BASE_URL=
            NEXT_PUBLIC_CURRENT_RELEASE=dev
            NEXT_PUBLIC_ENABLE_APP_LAUNCHER=false
            NEXT_PUBLIC_APP_NAME=Phenix
            NEXT_PUBLIC_ENABLE_SOCIAL_LOGIN=false
            NEXT_PUBLIC_ENABLE_BILLING_OPTION=true
            NEXT_PUBLIC_SOVIO_LANDINGPAGE_URL=
            NEXT_PUBLIC_POLYGON_TESTNET_URL=https://rpc-amoy.polygon.technology/
            NEXT_PUBLIC_POLYGON_MAINNET_URL=https://polygon-rpc.com/
            NEXT_PUBLIC_MARKETPLACE_MANAGE_URL=https://portal.azure.com/
            NEXT_PUBLIC_MARKETPLACE_PRODUCT_NAME=PHENIX ID
            NEXT_PUBLIC_MARKETPLACE_PUBLISHER_NAME=Phenix
            NEXT_PUBLIC_MARKETPLACE_SUPPORT_EMAIL=support@phenix-id.com
            NEXT_PUBLIC_MARKETPLACE_PRIVACY_EMAIL=privacy@phenix-id.com
            NEXT_PUBLIC_MARKETPLACE_REQUIRED=true
            NEXT_PUBLIC_MARKETPLACE_OFFER_URL=https://portal.azure.com/#create/iden2inc1778679045619.phenix_id
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: phenix-iac-manifests

      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/phenix-iac-manifests
          token: ${{ steps.app-token.outputs.token }}
          path: manifests

      - name: Update prod image tag
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"

          cd manifests/apps/${{ env.MANIFEST_ENV }}
          if grep -q "${{ env.IMAGE_NAME }}" kustomization.yaml; then
            sed -i "/^[[:space:]]*- name: .*\\/${{ env.IMAGE_NAME }}$/,/^[[:space:]]*newTag:/s|^[[:space:]]*newTag: .*|    newTag: $IMAGE_TAG # {\"\\\$imagepolicy\": \"flux-system:phenix-studio:tag\"}|" kustomization.yaml
          else
            echo "::error::${{ env.IMAGE_NAME }} not found in prod kustomization.yaml"
            exit 1
          fi

      - name: Commit and push
        run: |
          cd manifests
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"

          git config user.name "phenix-ci[bot]"
          git config user.email "phenix-ci[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "[prod] Update phenix-studio image to $IMAGE_TAG"
            git push
          else
            echo "No changes to commit"
          fi
